<!DOCTYPE html>
<html>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const margin = { left: 60, right: 20, top: 40, bottom: 50 };

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let rawData = [];
let centeredData = [];

console.log("SCRIPT LOADED");

const ws = new WebSocket("ws://10.195.150.111:8766");

ws.onopen = () => console.log("CONNECTED");

ws.onmessage = (event) => {
  console.log("DATA:", event.data);

  const obj = JSON.parse(event.data);

  const raw = parseFloat(obj.raw);
  const centered = parseFloat(obj.centered);

  if (!isNaN(raw) && !isNaN(centered)) {
    rawData.push(raw);
    centeredData.push(centered);

    if (rawData.length > 2000) rawData.shift();
    if (centeredData.length > 2000) centeredData.shift();
  }
};

ws.onerror = (e) => console.log("ERROR", e);
ws.onclose = () => console.log("CLOSED");

ctx.clearRect(0, 0, canvas.width, canvas.height);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.font = "16px Arial";
  ctx.fillStyle = "black";

  const totalHeight = canvas.height;
  const graphHeight = (totalHeight - margin.top - margin.bottom) / 2;
  const graphWidth = canvas.width - margin.left - margin.right;

  drawGraph(rawData, margin.top, graphHeight, graphWidth, "Raw Input", "Mic Voltage");

  drawGraph(
  	centeredData,
  	margin.top + graphHeight + 40,
  	graphHeight,
  	graphWidth,
  	"Centered Signal",
  	"Amplitude"
		);
  requestAnimationFrame(draw);
}

function drawGraph(data, offsetY, graphHeight, graphWidth, title, yLabel) {
  // GRID
  ctx.strokeStyle = "#ddd";
  ctx.beginPath();

  for (let i = 0; i <= 5; i++) {
    let y = offsetY + (i / 5) * graphHeight;
    ctx.moveTo(margin.left, y);
    ctx.lineTo(canvas.width - margin.right, y);
  }

  for (let i = 0; i <= 5; i++) {
    let x = margin.left + (i / 5) * graphWidth;
    ctx.moveTo(x, offsetY);
    ctx.lineTo(x, offsetY + graphHeight);
  }

  ctx.stroke();

  // AXES
  ctx.strokeStyle = "black";
  ctx.beginPath();

  ctx.moveTo(margin.left, offsetY);
  ctx.lineTo(margin.left, offsetY + graphHeight);
  ctx.lineTo(canvas.width - margin.right, offsetY + graphHeight);

  ctx.stroke();

  // LABELS
  ctx.fillText(title, canvas.width / 2 - 40, offsetY - 10);

  ctx.save();
  ctx.translate(15, offsetY + graphHeight / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(yLabel, 0, 0);
  ctx.restore();

  // DATA
  if (data.length < 2) return;

  const minVal = -90;
  const maxVal = 90;
  const range = maxVal - minVal;

  const midY = offsetY + graphHeight / 2;
  const verticalScale = 0.4;

  ctx.beginPath();

  for (let i = 0; i < data.length; i++) {
    let x = margin.left + (i / (data.length - 1)) * graphWidth;

    let normalized = (data[i] - minVal) / range - 0.5;
    let y = midY - normalized * graphHeight * verticalScale;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

draw();
</script>

</body>
</html>
